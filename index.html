<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사방에서 날아오는 소행성 피하기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    color: #e0e6ff;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    margin-bottom: 12px;
    font-size: 28px;
    letter-spacing: 2px;
    color: #7fd4ff;
    text-shadow: 0 0 12px rgba(127, 212, 255, 0.6);
  }
  .hud {
    width: 720px;
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 18px;
    font-weight: bold;
  }
  canvas {
    border: 2px solid #2b3a6b;
    border-radius: 10px;
    background: radial-gradient(circle at 50% 40%, #101630, #05070f);
    box-shadow: 0 0 30px rgba(60, 120, 255, 0.25);
    cursor: none;
  }
  .help {
    margin-top: 12px;
    font-size: 14px;
    color: #8a93b8;
    text-align: center;
    line-height: 1.6;
  }
  button {
    margin-top: 12px;
    padding: 10px 24px;
    font-size: 16px;
    font-weight: bold;
    color: #0a0e1f;
    background: #7fd4ff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  button:hover { background: #a8e4ff; }
</style>
</head>
<body>
  <h1>🚀 사방 소행성 피하기</h1>
  <div class="hud">
    <span>점수: <span id="score">0</span></span>
    <span>최고: <span id="best">0</span></span>
  </div>
  <canvas id="game" width="720" height="640"></canvas>
  <div class="help">↑ ↓ ← → 방향키 또는 WASD로 이동 · 마우스로도 이동 가능<br>사방에서 날아오는 소행성을 피하세요! 파란 방어막을 먹으면 잠시 무적!</div>
  <button id="restart">게임 다시 시작</button>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const restartBtn = document.getElementById('restart');

  const W = canvas.width;
  const H = canvas.height;
  const CX = W / 2;
  const CY = H / 2;
  const SHIELD_DURATION = 300; // 방어막 총 지속 프레임 (약 5초)
  const ASTEROID_SIZE = 22;    // 소행성 고정 크기
  const HOMING_TURN = 0.01;    // 소행성 유도 회전량 (아주 약함)

  // 플레이어(우주선)
  const player = {
    x: CX,
    y: CY,
    r: 15,
    speed: 5.5,
    vx: 0,
    vy: 0,
    tvx: 0,   // 목표 속도 (부드러운 가속용)
    tvy: 0,
    angle: -Math.PI / 2,
  };

  let asteroids = [];
  let stars = [];
  let shields = [];      // 방어막 아이템
  let score = 0;
  let best = 0;
  let gameOver = false;
  let frame = 0;
  let invincible = 0;    // 시작 시 잠깐 무적
  let shieldTime = 0;    // 방어막 지속 시간(프레임)
  let shieldTimer = 600; // 다음 방어막 생성까지 남은 프레임

  try { best = parseInt(localStorage.getItem('asteroid-4way-best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // 배경 별
  for (let i = 0; i < 90; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.6 + 0.3,
      speed: Math.random() * 1.0 + 0.2,
      angle: Math.random() * Math.PI * 2,
    });
  }

  function makeVertices(radius) {
    const pts = [];
    const n = Math.floor(Math.random() * 4) + 8;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const r = radius * (0.75 + Math.random() * 0.35);
      pts.push({ a, r });
    }
    return pts;
  }

  // 네 가장자리(상·하·좌·우)에서 랜덤하게 생성
  function spawnAsteroid() {
    const size = ASTEROID_SIZE;
    const edge = Math.floor(Math.random() * 4); // 0:상 1:하 2:좌 3:우
    let x, y;

    if (edge === 0) { x = Math.random() * W; y = -size; }
    else if (edge === 1) { x = Math.random() * W; y = H + size; }
    else if (edge === 2) { x = -size; y = Math.random() * H; }
    else { x = W + size; y = Math.random() * H; }

    // 화면 중앙(플레이어 시작 위치)을 향한 방향 + 약간의 퍼짐
    let baseAngle = Math.atan2(CY - y, CX - x);
    baseAngle += (Math.random() - 0.5) * 1.2; // 퍼짐

    const speed = 2.0 + score / 240 + Math.random() * 1.8;
    asteroids.push({
      x, y, size,
      vx: Math.cos(baseAngle) * Math.min(speed, 8),
      vy: Math.sin(baseAngle) * Math.min(speed, 8),
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.06,
      vertices: makeVertices(size),
    });
  }

  // 점수가 높을수록 한 번에 더 많은 소행성 생성
  function spawnWave() {
    const count = Math.min(10, 1 + Math.floor(score / 100));
    for (let i = 0; i < count; i++) spawnAsteroid();
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.beginPath();
    a.vertices.forEach((v, i) => {
      const px = Math.cos(v.a) * v.r;
      const py = Math.sin(v.a) * v.r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.closePath();
    ctx.fillStyle = '#4a4a55';
    ctx.fill();
    ctx.strokeStyle = '#7a7a8a';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#38383f';
    ctx.beginPath();
    ctx.arc(a.size * 0.25, -a.size * 0.1, a.size * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPlayer() {
    if (invincible > 0 && Math.floor(invincible / 3) % 2 === 0) return; // 깜빡임

    const mag = Math.hypot(player.vx, player.vy);

    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    // 이동 속도에 따른 엔진 불꽃 (뒤쪽 +y 방향)
    if (mag > 0.3) {
      const flame = 10 + Math.min(mag, 8) * 1.4 + Math.random() * 4;
      ctx.fillStyle = 'rgba(255,160,60,0.9)';
      ctx.beginPath();
      ctx.moveTo(-5, 14);
      ctx.lineTo(0, 14 + flame);
      ctx.lineTo(5, 14);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,230,120,0.9)';
      ctx.beginPath();
      ctx.moveTo(-3, 14);
      ctx.lineTo(0, 14 + flame * 0.5);
      ctx.lineTo(3, 14);
      ctx.closePath();
      ctx.fill();
    }

    // 본체 (삼각 우주선, 위를 향함)
    ctx.fillStyle = '#cfd8ff';
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(16, 14);
    ctx.lineTo(6, 10);
    ctx.lineTo(0, 16);
    ctx.lineTo(-6, 10);
    ctx.lineTo(-16, 14);
    ctx.closePath();
    ctx.fill();
    // 콕핏
    ctx.fillStyle = '#7fd4ff';
    ctx.beginPath();
    ctx.arc(0, -4, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // 방어막 아이템 생성 (화면 안 랜덤 위치)
  function spawnShield() {
    const margin = 40;
    shields.push({
      x: Math.random() * (W - margin * 2) + margin,
      y: Math.random() * (H - margin * 2) + margin,
      r: 15,
      life: 420, // 약 7초 후 사라짐
      pulse: Math.random() * Math.PI * 2,
    });
  }

  function drawShieldItem(s) {
    const blink = s.life < 120 && Math.floor(s.life / 8) % 2 === 0;
    if (blink) return;
    const pulse = 1 + Math.sin(s.pulse) * 0.12;
    ctx.save();
    ctx.translate(s.x, s.y);
    // 외곽 글로우
    ctx.fillStyle = 'rgba(127, 220, 255, 0.15)';
    ctx.beginPath();
    ctx.arc(0, 0, s.r * 2.2 * pulse, 0, Math.PI * 2);
    ctx.fill();
    // 방패 모양
    ctx.fillStyle = '#7fd4ff';
    ctx.beginPath();
    ctx.moveTo(0, -s.r);
    ctx.lineTo(s.r, -s.r * 0.5);
    ctx.lineTo(s.r * 0.6, 0);
    ctx.lineTo(s.r, s.r * 0.7);
    ctx.lineTo(0, s.r);
    ctx.lineTo(-s.r, s.r * 0.7);
    ctx.lineTo(-s.r * 0.6, 0);
    ctx.lineTo(-s.r, -s.r * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#e0f6ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  // 플레이어 주변 방어막 버블
  function drawShieldBubble() {
    if (shieldTime <= 0) return;
    const alpha = 0.35 + Math.sin(frame * 0.2) * 0.1;
    const radius = player.r + 12;
    const fraction = shieldTime / SHIELD_DURATION; // 1 → 0

    ctx.save();
    ctx.translate(player.x, player.y);

    // 보호막 원
    ctx.strokeStyle = 'rgba(127, 212, 255, ' + alpha + ')';
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(127, 212, 255, 0.9)';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(127, 212, 255, 0.08)';
    ctx.fill();

    // 남은 시간 링 (시계방향으로 줄어듦)
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, radius + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * fraction);
    ctx.stroke();

    // 남은 초 표시
    const sec = Math.ceil(shieldTime / 60);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px "Segoe UI", "Malgun Gothic", sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 4;
    ctx.fillText(sec + '초', 0, radius + 17);

    ctx.restore();
  }

  function drawStars() {
    for (const s of stars) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function isHit(a) {
    const dx = player.x - a.x;
    const dy = player.y - a.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    // 충돌 판정을 약간 여유 있게 (체감 히트박스 축소)
    return dist < a.size * 0.72 + 13;
  }

  function reset() {
    asteroids = [];
    shields = [];
    score = 0;
    gameOver = false;
    frame = 0;
    invincible = 90;    // 약 1.5초 무적
    shieldTime = 0;
    shieldTimer = 600;
    player.x = CX;
    player.y = CY;
    player.vx = 0;
    player.vy = 0;
    player.tvx = 0;
    player.tvy = 0;
    player.angle = -Math.PI / 2;
    scoreEl.textContent = '0';
  }

  function update() {
    // 별 이동
    for (const s of stars) {
      s.x += Math.cos(s.angle) * s.speed;
      s.y += Math.sin(s.angle) * s.speed;
      if (s.x < 0) s.x = W;
      if (s.x > W) s.x = 0;
      if (s.y < 0) s.y = H;
      if (s.y > H) s.y = 0;
    }

    if (invincible > 0) invincible--;
    if (shieldTime > 0) shieldTime--;

    if (gameOver) return;

    // 마우스가 잠시 움직이지 않으면 정지 (키 입력 기준으로 재계산)
    if (mouseActive && frame - lastMouseMoveFrame > 3) {
      mouseActive = false;
      updateVelocity();
    }

    // 플레이어 이동 (입력이 없으면 즉시 정지)
    player.vx = player.tvx;
    player.vy = player.tvy;
    player.x += player.vx;
    player.y += player.vy;
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y));

    // 이동 방향으로 기울이기
    if (Math.hypot(player.vx, player.vy) > 0.5) {
      const targetAngle = Math.atan2(player.vy, player.vx) + Math.PI / 2;
      let diff = targetAngle - player.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      player.angle += diff * 0.25;
    }

    // 방어막 아이템 생성 (중간중간 등장)
    shieldTimer--;
    if (shieldTimer <= 0) {
      spawnShield();
      shieldTimer = 720 + Math.random() * 480; // 다음 생성 간격 (드물게)
    }

    // 방어막 아이템 갱신 & 획득
    for (let i = shields.length - 1; i >= 0; i--) {
      const s = shields[i];
      s.life--;
      s.pulse += 0.08;
      if (s.life <= 0) {
        shields.splice(i, 1);
        continue;
      }
      const dx = player.x - s.x;
      const dy = player.y - s.y;
      if (Math.hypot(dx, dy) < s.r + player.r) {
        shieldTime = SHIELD_DURATION; // 약 5초 방어막
        shields.splice(i, 1);
      }
    }

    // 소행성 생성 (점수가 오를수록 수 증가)
    const spawnRate = Math.max(14, 30 - Math.floor(score / 60));
    if (frame % spawnRate === 0) spawnWave();

    // 소행성 이동 & 충돌
    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];

      // 아주 약한 유도: 우주선 방향으로 살짝 방향 전환
      const speed = Math.hypot(a.vx, a.vy);
      if (speed > 0) {
        const targetAngle = Math.atan2(player.y - a.y, player.x - a.x);
        const curAngle = Math.atan2(a.vy, a.vx);
        let diff = targetAngle - curAngle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const turn = Math.max(-HOMING_TURN, Math.min(HOMING_TURN, diff));
        const newAngle = curAngle + turn;
        a.vx = Math.cos(newAngle) * speed;
        a.vy = Math.sin(newAngle) * speed;
      }

      a.x += a.vx;
      a.y += a.vy;
      a.rot += a.rotSpeed;

      // 화면 밖으로 나가면 제거 + 점수
      if (a.x < -a.size - 40 || a.x > W + a.size + 40 ||
          a.y < -a.size - 40 || a.y > H + a.size + 40) {
        asteroids.splice(i, 1);
        score++;
        scoreEl.textContent = score;
        continue;
      }

      if (isHit(a)) {
        // 방어막 중이면 소행성을 파괴하고 통과
        if (shieldTime > 0) {
          asteroids.splice(i, 1);
          score++;
          scoreEl.textContent = score;
          continue;
        }
        if (invincible <= 0) {
          gameOver = true;
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            try { localStorage.setItem('asteroid-4way-best', String(best)); } catch (e) {}
          }
        }
      }
    }
  }

  function drawScore() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    // 배경 라벨
    ctx.fillStyle = 'rgba(10, 14, 31, 0.55)';
    ctx.beginPath();
    ctx.roundRect(W / 2 - 60, 8, 120, 34, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(127, 212, 255, 0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 점수 숫자
    ctx.fillStyle = '#7fd4ff';
    ctx.font = 'bold 24px "Segoe UI", "Malgun Gothic", sans-serif';
    ctx.shadowColor = 'rgba(127, 212, 255, 0.7)';
    ctx.shadowBlur = 10;
    ctx.fillText('점수 ' + score, W / 2, 14);
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawStars();
    for (const a of asteroids) drawAsteroid(a);
    for (const s of shields) drawShieldItem(s);
    if (!gameOver) {
      drawShieldBubble();
      drawPlayer();
    }
    drawScore();

    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff7f7f';
      ctx.font = 'bold 42px "Segoe UI", "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('게임 오버', W / 2, H / 2 - 20);
      ctx.fillStyle = '#e0e6ff';
      ctx.font = '20px "Segoe UI", "Malgun Gothic", sans-serif';
      ctx.fillText('점수: ' + score, W / 2, H / 2 + 24);
      ctx.fillText('클릭 또는 버튼으로 다시 시작', W / 2, H / 2 + 58);
    }
  }

  function loop() {
    frame++;
    update();
    render();
    requestAnimationFrame(loop);
  }

  // 키보드 조작 (방향키 + WASD)
  const keys = {};
  function updateVelocity() {
    let vx = 0, vy = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) vx -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) vx += 1;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) vy -= 1;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) vy += 1;
    const len = Math.hypot(vx, vy);
    if (len > 0) { vx /= len; vy /= len; }
    player.tvx = vx * player.speed;
    player.tvy = vy * player.speed;
  }

  window.addEventListener('keydown', (e) => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    updateVelocity();
    if (e.key === ' ' && gameOver) reset();
  });

  window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
    updateVelocity();
  });

  // 마우스 이동: 마우스를 향해 이동 (움직이지 않으면 정지)
  let mouseActive = false;
  let lastMouseMoveFrame = -1000;
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    mouseActive = true;
    lastMouseMoveFrame = frame;
    const dx = mx - player.x;
    const dy = my - player.y;
    const len = Math.hypot(dx, dy);
    if (len > 2) {
      player.tvx = (dx / len) * player.speed;
      player.tvy = (dy / len) * player.speed;
    } else {
      player.tvx = 0;
      player.tvy = 0;
    }
  });

  canvas.addEventListener('mouseleave', () => {
    mouseActive = false;
    updateVelocity();
  });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const mx = (e.touches[0].clientX - rect.left) * scaleX;
    const my = (e.touches[0].clientY - rect.top) * scaleY;
    const dx = mx - player.x;
    const dy = my - player.y;
    const len = Math.hypot(dx, dy);
    if (len > 2) {
      player.tvx = (dx / len) * player.speed;
      player.tvy = (dy / len) * player.speed;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    player.tvx = 0;
    player.tvy = 0;
  });

  canvas.addEventListener('click', () => {
    if (gameOver) reset();
  });

  restartBtn.addEventListener('click', reset);

  reset();
  loop();
})();
</script>
</body>
</html>
